<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy Gift</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent !important}
canvas{display:block;width:100%;height:100%;background:transparent !important}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated galaxy appreciation gift"></canvas>
<script>
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:true});
const qs=new URLSearchParams(location.search);
const TAU=Math.PI*2;
const C={void:'#08081a',violet:'#9c67ff',pink:'#ff71dd',cyan:'#72eeff',gold:'#ffe6a0',white:'#fff8ff'};
let W=0,H=0,DPR=1,stars=[],dust=[],sparks=[],comets=[],galaxy=[],run=null,started=0,raf=0,muted=false,audio=null;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{let t=clamp((x-a)/(b-a));return t*t*(3-2*t)},fade=(a,b,c,d,t)=>smooth(a,b,t)*(1-smooth(c,d,t));
const rand=(a,b)=>a+Math.random()*(b-a);
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  stars=Array.from({length:Math.max(120,Math.min(440,Math.floor(W*H/4100)))},()=>({x:Math.random()*W,y:Math.random()*H,r:rand(.35,1.8),p:rand(0,7),speed:rand(.6,2.2)}));
}
addEventListener('resize',resize);
resize();

function unlockAudio(){
  try{
    audio??=new (window.AudioContext||window.webkitAudioContext)();
    audio.resume();
  }catch{
    muted=true;
  }
}
function tone(freq,duration,when=0,type='sine',gain=.08,glide=0){
  if(muted||!audio)return;
  const now=audio.currentTime+when,o=audio.createOscillator(),g=audio.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,now);
  if(glide)o.frequency.exponentialRampToValueAtTime(Math.max(20,glide),now+duration);
  g.gain.setValueAtTime(.0001,now);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),now+.018);
  g.gain.exponentialRampToValueAtTime(.0001,now+duration);
  o.connect(g);
  g.connect(audio.destination);
  o.start(now);
  o.stop(now+duration+.02);
}
function playSound(){
  if(muted)return;
  unlockAudio();
  tone(70,.55,0,'sawtooth',.045,26);
  tone(110,.8,.16,'sine',.18,38);
  tone(1800,.24,.17,'triangle',.07,520);
  [0,4,7,12,16,19].forEach((n,i)=>tone(220*Math.pow(2,n/12),.83,.38+i*.105,'sine',.045));
  tone(92,.65,1.1,'triangle',.09,46);
  tone(1500,.7,3.9,'sine',.035,280);
  tone(95,.62,4.22,'sine',.14,28);
}
const clean=(v,max=40)=>String(v??'').replace(/[\x00-\x1f]/g,'').slice(0,max);

function start(payload={}){
  const data={
    name:clean(payload.name??qs.get('name')??'A STAR',25),
    creator:clean(payload.creator??qs.get('creator')??'GOKU',25).replace(/^@/,''),
    message:clean(payload.message??qs.get('message')??'You are out of this world!',75),
    amount:clean(payload.amount??qs.get('amount')??'',12)
  };
  started=performance.now();
  run=data;
  dust=[];sparks=[];comets=[];galaxy=[];
  for(let i=0;i<5600;i++){
    let arm=i%3,rad=Math.pow(Math.random(),.7),spread=rand(-.45,.45)*(.2+rad),theta=arm*TAU/3+rad*5.8+spread;
    galaxy.push({rad,theta,z:rand(-1,1)*(.12+.13*(1-rad)),size:rand(.35,1.7)*(rad<.2?1.2:1),tw:rand(0,TAU),h:Math.random(),dust:Math.random()<.17});
  }
  for(let i=0;i<2100;i++){
    let rad=Math.abs((Math.random()+Math.random()+Math.random())/3-.5)*.83,theta=rand(0,TAU);
    galaxy.push({rad,theta,z:rand(-.35,.35),size:rand(.3,1.5),tw:rand(0,TAU),h:Math.random(),dust:false});
  }
  for(let i=0;i<520;i++){
    let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random());
    dust.push({a,r,spin:rand(-.5,.5),size:rand(.6,2.6),h:Math.random(),phase:rand(0,7)});
  }
  for(let i=0;i<340;i++){
    let a=rand(0,Math.PI*2),v=rand(140,890);
    sparks.push({a,v,size:rand(.7,3.4),life:rand(.45,1.45),delay:rand(0,.34),h:Math.random()});
  }
  for(let i=0;i<16;i++){
    comets.push({at:.55+i*.18,angle:rand(-2.8,-.2),radius:rand(100,430),size:rand(1,3.3)});
  }
  playSound();
  if(!raf)raf=requestAnimationFrame(frame);
}

window.playGalaxyGift=start;
addEventListener('message',e=>{if(e.data?.type==='GALAXY_GIFT')start(e.data.payload||{})});

function glow(x,y,r,color,alpha=1){
  if(alpha<=0)return;
  let g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,color);
  g.addColorStop(1,'transparent');
  ctx.globalAlpha=alpha;
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(x,y,r,0,7);
  ctx.fill();
  ctx.globalAlpha=1;
}
function dot(x,y,r,color,alpha=1){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,Math.max(.1,r),0,7);
  ctx.fill();
  ctx.globalAlpha=1;
}
function ring(cx,cy,rx,ry,angle,color,width,alpha,blur=0){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(angle);
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=blur;
  ctx.shadowColor=color;
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.beginPath();
  ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);
  ctx.stroke();
  ctx.restore();
}
function text(s,x,y,size,color,alpha=1,weight=700,spacing=0){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=18*alpha;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`${weight} ${size}px Inter,system-ui,sans-serif`;
  if('letterSpacing'in ctx)ctx.letterSpacing=spacing+'px';
  ctx.fillText(s,x,y,Math.max(80,W*.87));
  ctx.restore();
}

function frame(now){
  raf=requestAnimationFrame(frame);
  ctx.clearRect(0,0,W,H);
  if(!run)return;
  const t=(now-started)/1000,cx=W/2,cy=H*.47,S=Math.min(W/1000,H/700,1.25),scale=Math.max(.55,S),intro=smooth(0,.9,t),out=1-smooth(4.35,5,t),power=fade(0,.28,4.2,5,t);
  
  // 5 seconds playback, then stop/pause 3 seconds, then loop
  if(t>=5){
    run=null;
    cancelAnimationFrame(raf);
    raf=0;
    ctx.clearRect(0,0,W,H);
    setTimeout(start, 3000);
    return;
  }

  for(const s of stars){
    let tw=(Math.sin(t*s.speed+s.p)+1)/2;
    dot(s.x,s.y,s.r*scale,C.white,(.16+tw*.68)*power);
    if(s.r>1.4&&tw>.82){
      ctx.strokeStyle=`rgba(194,181,255,${(tw-.8)*2*power})`;
      ctx.lineWidth=.7;
      ctx.beginPath();
      ctx.moveTo(s.x-6*scale,s.y);
      ctx.lineTo(s.x+6*scale,s.y);
      ctx.moveTo(s.x,s.y-6*scale);
      ctx.lineTo(s.x,s.y+6*scale);
      ctx.stroke();
    }
  }

  const grow=smooth(.08,.83,t), collapse=1-smooth(4.38,4.97,t), R=225*scale*grow*collapse,rot=t*.84;
  glow(cx,cy,R*2.5,C.violet,.14*power);
  glow(cx,cy,R*1.9,C.cyan,.09*power);

  const tilt=-.36,ca=Math.cos(tilt),sa=Math.sin(tilt),disk=1.52*R,spin=t*.16;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(tilt);

  ctx.globalCompositeOperation='screen';
  for(let arm=0;arm<3;arm++)for(let j=0;j<93;j++){
    let u=j/92,a=arm*TAU/3+u*5.8+spin,r=disk*(.09+u*.88);
    let x=Math.cos(a)*r,y=Math.sin(a)*r*.4;
    glow(x,y,(14+u*25)*scale,arm===0?C.cyan:arm===1?C.violet:C.pink,(.018+.034*(1-u))*power);
  }

  ctx.globalCompositeOperation='source-over';
  for(let i=0;i<dust.length;i++){
    let d=dust[i],a=d.a+rot*(.18+.25*d.r)+Math.sin(t*.8+d.phase)*.08,r=disk*(.15+d.r*.85);
    let x=Math.cos(a)*r,y=Math.sin(a)*r*.38;
    dot(x,y,d.size*scale,d.h<.5?'#060416':'#150d32',(.22+.18*Math.sin(d.phase+t))*power);
  }

  for(let i=0;i<galaxy.length;i++){
    let p=galaxy[i],a=p.theta+spin*(1.2-p.rad*.7),r=disk*(.06+p.rad*.94);
    let x=Math.cos(a)*r,y=Math.sin(a)*r*.42+p.z*disk*.18;
    let c=p.dust?'#130a24':p.rad<.16?C.gold:p.rad<.45?C.white:p.rad<.8?C.cyan:C.pink;
    let alpha=p.dust?.32*power:(.25+.75*Math.sin(p.tw+t*2.8)**2)*power;
    dot(x,y,p.size*scale,c,alpha);
  }

  glow(0,0,disk*.26,C.gold,.45*power);
  glow(0,0,disk*.12,C.white,.75*power);
  ctx.restore();

  for(let i=0;i<11;i++){
    let a=i*2.39996+spin*2,r=R*(.46+(i%5)*.17),x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r*.4;
    glow(x,y,18*scale,C.cyan,.25*power);
    dot(x,y,(1.6+i%3)*scale,C.white,.65*power);
  }

  for(const s of sparks){
    let age=t-.18-s.delay;
    if(age<0||age>s.life)continue;
    let q=age/s.life,r=(12+s.v*age)*scale,x=cx+Math.cos(s.a)*r,y=cy+Math.sin(s.a)*r*.7;
    glow(x,y,s.size*10*scale,s.h<.5?C.cyan:C.pink,(1-q)*.32*out);
    dot(x,y,s.size*scale,C.white,(1-q)*out);
  }

  for(const co of comets){
    let age=t-co.at;
    if(age<0||age>.7)continue;
    let p=age/.7,x=cx+Math.cos(co.angle)*co.radius*scale+(p-.5)*W*.48,y=cy+Math.sin(co.angle)*co.radius*.5*scale+p*H*.22;
    const grad=ctx.createLinearGradient(x-90*scale,y-42*scale,x,y);
    grad.addColorStop(0,'transparent');
    grad.addColorStop(1,C.cyan);
    ctx.strokeStyle=grad;
    ctx.globalAlpha=(1-p)*.85*out;
    ctx.lineWidth=co.size*scale;
    ctx.beginPath();
    ctx.moveTo(x-90*scale,y-42*scale);
    ctx.lineTo(x,y);
    ctx.stroke();
    ctx.globalAlpha=1;
    dot(x,y,co.size*scale,C.white,(1-p)*out);
  }

  for(const hit of [.2,1.13]){
    let q=(t-hit)/.88;
    if(q>=0&&q<1){
      let radius=(24+Math.max(W,H)*.7*q)*scale;
      ring(cx,cy,radius,radius*.68,0,C.white,(8-6*q)*scale,(1-q)**2*.83,25);
      ring(cx,cy,radius*.83,radius*.57,0,C.cyan,3*scale,(1-q)*.68,16);
      glow(cx,cy,Math.max(W,H)*(.14+.55*q),hit<1?C.pink:C.cyan,(1-q)**3*.25);
    }
  }

  let blast=fade(.13,.25,.52,.82,t);
  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(t*.13);
  for(let i=0;i<36;i++){
    let a=i*Math.PI/18,near=50*scale,far=(90+Math.sin(i*43.7)*35+blast*260)*scale;
    ctx.strokeStyle=i%3?C.cyan:C.gold;
    ctx.globalAlpha=blast*(i%4===0?.55:.25);
    ctx.lineWidth=(i%4===0?2.5:1)*scale;
    ctx.shadowBlur=18;
    ctx.shadowColor=ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*near,Math.sin(a)*near*.73);
    ctx.lineTo(Math.cos(a)*far,Math.sin(a)*far*.73);
    ctx.stroke();
  }
  ctx.restore();

  const flash=1-smooth(.21,.47,t);
  glow(cx,cy,Math.max(W,H)*.6,C.white,flash*.27);
  let reveal=fade(.75,1.28,3.82,4.62,t),nameSize=clamp(W*.049,22,48)*scale,small=clamp(W*.018,14,20)*scale;
  text('✦  GALAXY APPRECIATION  ✦',cx,cy-R*.96-50*scale,small,C.gold,reveal,750,3);
  text(run.name.toUpperCase(),cx,cy+R*.71+46*scale,nameSize,C.white,reveal,850,2);
  text('sent a galaxy to @'+run.creator, cx,cy+R*.71+91*scale,small,C.cyan,reveal,600,1);
  if(run.message)text('“'+run.message+'”',cx,cy+R*.71+127*scale,small*.89,C.white,reveal*.9,450,0);
  if(run.amount)text('£'+run.amount,cx,cy+R*.71+165*scale,small*.95,C.gold,reveal*.95,700,1);
}

// Start auto-playback loop
start();

// Enable sound on first interaction
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('click',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio,{passive:true});
</script>
</body>
</html>
